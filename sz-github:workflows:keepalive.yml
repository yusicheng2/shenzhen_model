name: Keep Streamlit Apps Alive (Playwright)

on:
  schedule:
    # 建议每 4 小时触发一次，保持应用活跃
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Keep apps awake
        run: |
          python - << 'EOF'
          import asyncio
          import re
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          # 需要保活的 Streamlit 网址列表
          urls = [
              "https://shenzhenmodel-9ihnhaceacjjxieza3wapz.streamlit.app/"
          ]

          async def visit(url):
              async with async_playwright() as p:
                  # 启动 Chromium 并规避自动化特征
                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-setuid-sandbox",
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )
                  context = await browser.new_context(
                      viewport={"width": 1280, "height": 800},
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
                  )
                  page = await context.new_page()

                  try:
                      print(f"正在访问: {url}")
                      
                      # 改进1: 将 wait_until 设为 "load"，确保 React 前端完全渲染
                      await page.goto(url, wait_until="load", timeout=90_000)

                      # 改进2: 使用 get_by_text 扩大匹配面，并增加 .first 避免严格模式报错
                      wake_element = page.get_by_text(
                          re.compile(r"get this app back up", re.IGNORECASE)
                      ).first

                      try:
                          # 改进3: 使用智能等待代替死等 (wait_for_timeout)，最多等15秒
                          await wake_element.wait_for(state="visible", timeout=15000)
                          print(f"检测到休眠状态，正在点击唤醒: {url}")
                          await wake_element.click()
                          
                          # 点击后预留 25 秒让 Streamlit 容器完成启动初始化
                          await page.wait_for_timeout(25000)
                          print(f"✅ 唤醒请求已成功发送并等待完成: {url}")
                          
                      except PlaywrightTimeoutError:
                          print(f"✅ 未检测到休眠按钮（超时未出现），应用可能当前处于活跃状态: {url}")

                  except Exception as e:
                      print(f"⚠️ 处理异常 [{url}]: {e}")
                  finally:
                      await context.close()
                      await browser.close()

          async def main():
              for target_url in urls:
                  await visit(target_url)

          if __name__ == "__main__":
              asyncio.run(main())
          EOF
